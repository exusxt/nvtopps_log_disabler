name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /std:c11 /O1 /GL /MT /utf-8 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN /c src\main.c /Fobuild\main.obj
          rc /nologo /I src /fo build\resource.res src\resource.rc
          link /nologo /LTCG /OPT:REF /OPT:ICF /SUBSYSTEM:WINDOWS /MANIFEST:NO /OUT:build\nvtopps-log-disabler.exe build\main.obj build\resource.res kernel32.lib user32.lib gdi32.lib advapi32.lib

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { 'dev' }
          $exe = "nvtopps-log-disabler-$version.exe"
          Copy-Item build\nvtopps-log-disabler.exe build\$exe
          Compress-Archive -Path build\$exe,README.md,README.de.md,LICENSE -DestinationPath build\nvtopps-log-disabler-$version.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvtopps-log-disabler
          path: build/*.zip
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME build\*.zip --generate-notes --title $env:GITHUB_REF_NAME
